<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaibkooder Broneeringud</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😊</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="main-wrapper">
    <div class="container">
        <header>
            <h1>Vaibkooder Broneeringud</h1>
            <p>Eksklusiivne ülevaade eelseisvatest teenustest</p>
        </header>

        <div class="controls">
            <div class="left-controls" style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all">Kõik</button>
                    <button class="filter-btn" data-filter="Juuksur">Juuksur</button>
                    <button class="filter-btn" data-filter="Massaaž">Massaaž</button>
                    <button class="filter-btn" data-filter="Spa">Spa</button>
                    <button class="filter-btn" data-filter="Kosmeetika">Kosmeetika</button>
                </div>
                <button class="new-booking-btn" id="newBookingBtn">Broneeri</button>
            </div>
            <div class="search-group">
                <input type="text" id="searchInput" placeholder="Otsi klienti...">
            </div>
        </div>

        <div class="table-container">
            <table id="bookingsTable">
                <thead>
                    <tr>
                        <th>Klient</th>
                        <th>Teenus</th>
                        <th>Kuupäev</th>
                        <th>Kellaaeg</th>
                    </tr>
                </thead>
                <tbody id="bookingsBody">
                    <!-- Read genereeritakse siia JavaScriptiga -->
                </tbody>
            </table>
        </div>
    </div>

        <aside class="ad-sidebar" id="adSidebar" style="display: none;">
            <div id="adContent"></div>
        </aside>
    </div>

    <!-- Uus broneering modal -->
    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Uus Broneering</h2>
                <span class="close-modal" id="closeModal">&times;</span>
            </div>
            <form id="bookingForm">
                <div class="form-group">
                    <label>Klient</label>
                    <input type="text" id="bName" required>
                </div>
                <div class="form-group">
                    <label>Teenus</label>
                    <select id="bService" required>
                        <option value="Juuksur">Juuksur</option>
                        <option value="Massaaž">Massaaž</option>
                        <option value="Spa">Spa</option>
                        <option value="Kosmeetika">Kosmeetika</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Kuupäev</label>
                    <input type="date" id="bDate" required>
                </div>
                <div class="form-group">
                    <label>Kellaaeg</label>
                    <input type="time" id="bTime" required>
                </div>
                <button type="submit" class="submit-booking">Broneeri</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
